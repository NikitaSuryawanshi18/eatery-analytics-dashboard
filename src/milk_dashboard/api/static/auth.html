<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | Milk Ops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/auth.css?v=20260624c" />
  <script src="/static/auth.js?v=20260624c" defer></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="authTitle">
      <div class="brand"><span class="brand-mark">M</span><span>Milk Ops</span></div>
      <div class="auth-heading">
        <h1 id="authTitle">Welcome back</h1>
        <p>Sign in to view your cafe operations dashboard.</p>
      </div>
      <form id="loginForm" novalidate>
        <label><span class="field-label">Email <span class="required">*</span></span>
          <input id="loginEmail" type="email" autocomplete="email" placeholder="owner@example.com" />
          <span id="loginEmailError" class="field-error"></span>
        </label>
        <label><span class="field-label">Password <span class="required">*</span></span>
          <span class="password-field"><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Your password" /><button id="loginPasswordToggle" type="button" aria-label="Show password" aria-pressed="false">&#128065;</button></span>
          <span id="loginPasswordError" class="field-error"></span>
        </label>
        <p id="loginStatus" class="status" aria-live="polite"></p>
        <button id="loginSubmit" class="btn btn-primary" type="submit">Login</button>
      </form>
      <p class="register-prompt">Need access? Ask your dashboard administrator for an invitation link.</p>
    </section>
  </main>

  <div id="registerModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="registerTitle">
    <form id="registerForm" class="modal-panel" novalidate>
      <div class="modal-head"><h2 id="registerTitle">Create account</h2><button id="closeRegister" class="icon-button" type="button" aria-label="Close">&times;</button></div>
      <div class="modal-grid">
        <label><span class="field-label">First name <span class="required">*</span></span><input id="registerFirstName" type="text" autocomplete="given-name" /><span id="registerFirstNameError" class="field-error"></span></label>
        <label><span class="field-label">Last name <span class="required">*</span></span><input id="registerLastName" type="text" autocomplete="family-name" /><span id="registerLastNameError" class="field-error"></span></label>
        <label class="full-width"><span class="field-label">Email <span class="required">*</span></span><input id="registerEmail" type="email" autocomplete="email" /><span id="registerEmailError" class="field-error"></span></label>
        <label class="full-width"><span class="field-label">Password <span class="required">*</span></span><span class="password-field"><input id="registerPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters" /><button id="registerPasswordToggle" type="button" aria-label="Show password" aria-pressed="false">&#128065;</button></span><span id="registerPasswordError" class="field-error"></span></label>
      </div>
      <p id="registerStatus" class="status" aria-live="polite"></p>
      <div class="modal-actions"><button id="cancelRegister" class="btn btn-secondary" type="button">Cancel</button><button id="registerSubmit" class="btn btn-primary" type="submit">Register</button></div>
    </form>
  </div>
</body>
</html>
